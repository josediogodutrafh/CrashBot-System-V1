# ============================================
# CRASHBOT SYSTEM - PYTHON PROJECT CONFIG
# ============================================

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crashbot-system"
version = "3.0.0"
description = "Sistema automatizado de trading para jogo Crash com IA"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "CrashBot Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# ============================================
# BLACK FORMATTER
# ============================================
[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    # Diretórios a ignorar
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | migrations
  | __pycache__
)/
'''

# ============================================
# ISORT (Import Sorting)
# ============================================
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "node_modules",
    "migrations"
]
known_first_party = ["crashbot", "crash"]
known_third_party = [
    "dearpygui",
    "opencv",
    "torch",
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "numpy",
    "pandas"
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ============================================
# RUFF LINTER
# ============================================
[tool.ruff]
# Mesma linha que Black
line-length = 88
target-version = "py310"

# Diretórios a ignorar
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "migrations",
    "node_modules",
]

[tool.ruff.lint]
# Regras habilitadas
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C90",    # mccabe complexity
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # Ruff-specific rules
]

# Regras ignoradas (podem ser ajustadas)
ignore = [
    "E501",    # line too long (Black cuida disso)
    "COM812",  # trailing comma missing (conflita com Black)
    "ISC001",  # single line implicit string concat (conflita com formatter)
    "T201",    # print found (usado para logging em alguns casos)
    "TRY003",  # Avoid specifying long messages outside exception class
    "PLR0913", # Too many arguments to function call
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "ARG001",  # Unused function argument (comum em callbacks)
    "ARG002",  # Unused method argument
]

# Permitir auto-fix
fixable = ["ALL"]
unfixable = []

# Permitir imports não utilizados em __init__.py
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"test_*.py" = ["ARG", "PLR2004"]
"**/tests/**/*.py" = ["ARG", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.validator"]

# ============================================
# PYTEST
# ============================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",                    # Show summary of all test outcomes
    "--strict-markers",       # Error on unknown markers
    "--strict-config",        # Error on unknown config
    "--showlocals",          # Show local variables in tracebacks
    "--tb=short",            # Short traceback format
    "--cov=CrashBot-System-V1/CrashBot",  # Coverage for CrashBot module
    "--cov-report=html",                  # HTML coverage report
    "--cov-report=term-missing",          # Terminal report with missing lines
    "--cov-fail-under=30",                # Fail if coverage < 30%
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "ml: marks tests related to machine learning",
    "vision: marks tests related to computer vision",
    "api: marks tests related to API",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# ============================================
# MYPY (Type Checking)
# ============================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradualmente ativar
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true  # Muitas libs sem tipos

[[tool.mypy.overrides]]
module = [
    "dearpygui.*",
    "cv2.*",
    "easyocr.*",
    "pytesseract.*",
    "pyautogui.*",
    "mss.*",
]
ignore_missing_imports = true

# ============================================
# COVERAGE
# ============================================
[tool.coverage.run]
source = ["CrashBot-System-V1/CrashBot"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
